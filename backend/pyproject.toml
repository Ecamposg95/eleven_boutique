[project]
name = "eleven-boutique-backend"
version = "0.1.0"
description = "API pública del catálogo de Eleven Boutique"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
