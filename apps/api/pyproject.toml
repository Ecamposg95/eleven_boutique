[project]
name = "eleven-api"
version = "0.1.0"
description = "API de Eleven Boutique: catálogo, medios, atención e integraciones"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
]

[project.scripts]
eleven = "eleven.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eleven"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
packages = ["eleven"]
mypy_path = "src"
